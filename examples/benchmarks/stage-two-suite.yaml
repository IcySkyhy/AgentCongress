isolation:
  agent_visible:
    - instruction
    - prepared_task_environment
  agent_forbidden:
    - source_solution_directory
    - source_tests_directory
    - verifier_files
    - gold_patch
  network_during_agent: disabled
  network_during_verifier: disabled
  verifier_mount: after_agent_exit
  source_acquisition: sealed_control_plane_only
  upstream_network_setting_override: >
    Terminal-Bench manifests currently permit internet access. Stage 2 overrides
    that setting to disabled for every arm; an offline oracle failure excludes
    the task instead of enabling network for selected runs.

oracle_gate:
  required_before_any_model_run: true
  checks:
    - source_revision_and_task_locator_resolve
    - image_reference_resolves_to_recorded_immutable_digest
    - verifier_files_and_solution_are_absent_during_agent_phase
    - network_egress_probe_fails_during_agent_phase
    - official_oracle_reaches_success_value_from_a_clean_environment
    - no_op_control_does_not_reach_success_value
    - verifier_output_is_machine_readable_and_archived
  failure_action: exclude_task_and_replace_before_unblinding_results

budget:
  worker_sessions: 3
  total_agent_seconds: 1200
  no_rollover: true
  slots:
    - name: analysis
      max_seconds: 180
      filesystem: read_only
    - name: critique
      max_seconds: 180
      filesystem: read_only
    - name: execution
      max_seconds: 840
      filesystem: workspace_write
  validation_and_scoring: outside_agent_budget_with_task_specific_hard_timeout
  reasoning_effort: high

conditions:
  - id: A
    label: LLL-self
    strategy: self
    analysis_model: gpt-5.6-luna
    critique_model: gpt-5.6-luna
    critique_identity: same_as_analyst
    execution_model: gpt-5.6-luna
  - id: B
    label: LLL-congress
    strategy: congress
    analysis_model: gpt-5.6-luna
    critique_model: gpt-5.6-luna
    critique_identity: independent_listener
    execution_model: gpt-5.6-luna
  - id: C
    label: SSS-self
    strategy: self
    analysis_model: gpt-5.6-sol
    critique_model: gpt-5.6-sol
    critique_identity: same_as_analyst
    execution_model: gpt-5.6-sol
  - id: D
    label: LLS-self
    strategy: self
    analysis_model: gpt-5.6-luna
    critique_model: gpt-5.6-luna
    critique_identity: same_as_analyst
    execution_model: gpt-5.6-sol
  - id: E
    label: LLS-congress
    strategy: congress
    analysis_model: gpt-5.6-luna
    critique_model: gpt-5.6-luna
    critique_identity: independent_listener
    execution_model: gpt-5.6-sol

predeclared_contrasts:
  - id: congress_same_model
    expression: B-A
  - id: congress_with_sol_executor
    expression: E-D
  - id: luna_deliberation_substitution
    expression: D-C
  - id: cheap_congress_leverage
    expression: E-C

run_design:
  pilot:
    repetitions_per_task_condition: 1
    purpose: calibration_and_failure_discovery_only
  confirmatory:
    repetitions_per_task_condition: 2
    third_repetition_trigger: discordant_or_predeclared_near_threshold_result
    third_repetition_scope: all_five_conditions_for_that_task
  randomization:
    unit: condition_order_within_task_and_repetition
    seed: 20260812
  pairing_unit: task_and_repetition

failure_classes:
  - infra_error
  - budget_timeout
  - protocol_failure
  - human_input_required
  - validation_failure
  - valid_noop
  - valid_submission
  - scorer_error

analysis_policy:
  objective_success_is_separate_from_execution_status: true
  infra_error: replace_entire_paired_block_and_retain_in_reliability_appendix
  budget_timeout: intention_to_treat_failure_with_partial_score_diagnostic_only
  quality_aggregation: paired_by_task_and_repetition
  fewer_than_three_usable_pairs: exploratory

run_manifest_requirements:
  - framework_git_sha
  - clean_framework_tree_or_archived_tree_hash
  - codex_cli_version
  - operating_system_and_architecture
  - python_version
  - container_runtime_version
  - source_revision
  - task_metadata_sha256
  - image_digest
  - verifier_sha256
  - prompt_and_report_schema_sha256
  - model_and_reasoning_effort_by_slot
  - randomization_seed_and_realized_order
  - usage_by_model
  - wall_time_by_slot
  - execution_status
  - objective_success
  - structured_score

